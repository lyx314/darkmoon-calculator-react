<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Darkmoon Calculator</title>
    <link rel="icon" href="img/kirara-favicon.webp" />

    <!-- 在样式加载前先套上主题，避免首屏颜色闪烁 -->
    <script>
      try {
        var cached = localStorage.getItem("data");
        var theme = cached ? JSON.parse(cached).colorTheme : null;
        document.documentElement.dataset.theme =
          typeof theme === "string" && theme ? theme : "cyan";
      } catch (error) {
        document.documentElement.dataset.theme = "cyan";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
